[project]
name = "hermes-eval"
version = "0.1.0"
description = "Hermes evaluation harness — F-WER, E-WER and paired bootstrap over dictation utterances."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-eval = "hermes_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1.380"]
# Build-time only, for `hermes-eval build-dataset`: audio decode, resampling and the
# robustness transforms. The scoring path stays stdlib-only on purpose — see
# src/hermes_eval/__init__.py — so this group is never needed to run or compare.
data = ["numpy>=1.26", "soundfile>=0.12", "pyarrow>=15", "huggingface-hub>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff format rewrites Python code blocks inside Markdown; the docs are prose and
# research memos, not code we own.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
