[project]
name = "hermes-eval"
version = "0.1.0"
description = "Hermes evaluation harness — F-WER, E-WER and paired bootstrap over dictation utterances."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-eval = "hermes_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff format rewrites Python code blocks inside Markdown; the docs are prose and
# research memos, not code we own.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
